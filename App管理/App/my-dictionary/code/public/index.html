<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="辞書">
  <title>My辞書</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top" id="top">
    <div class="title-row">
      <button class="menu-btn" id="menuBtn" aria-label="メニューを開く" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="dictName">辞書</h1>
      <span class="count" id="count"></span>
    </div>
    <div class="filters" id="filters" role="toolbar" aria-label="タグで絞り込み"></div>
  </header>

  <main id="main">
    <div id="list" class="list" aria-live="polite"></div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <nav class="index" id="index" aria-label="50音・アルファベット索引"></nav>
  <div class="index-bubble" id="indexBubble" hidden></div>

  <!-- Safari と同じ位置（画面下部）の検索バー -->
  <div class="toolbar" id="toolbar">
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="単語・読み・意味を検索" aria-label="検索">
      <button type="button" class="clear" id="clear" aria-label="検索語を消去" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8.5 8.5 7 7m0-7-7 7"/></svg>
      </button>
    </form>
    <button class="plus" id="plus" aria-label="単語を追加" aria-haspopup="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div id="sheetHost"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
