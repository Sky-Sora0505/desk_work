<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Java Silver 17 ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 1カラムの縦積み。ホーム＝章ごとの節チェックリスト、出題＝問題カード1枚。黒本の ○△× をそのまま状態表示に使う */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#141B27; --muted:#5A6577; --line:#D7DDE7;
  --accent:#3B47B8; --accent-ink:#FFFFFF; --accent-soft:#E3E6FA;
  --ok:#17804F; --ok-soft:#DDF2E7; --mid:#B26E00; --mid-soft:#FBEBCF; --ng:#C33333; --ng-soft:#F9DFDF;
  --code-bg:#1B2233; --code-fg:#E6EAF2;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#171D29; --ink:#E7EBF3; --muted:#9AA5B8; --line:#2A3345;
  --accent:#8F9BFF; --accent-ink:#0F131B; --accent-soft:#252C52;
  --ok:#4CC88A; --ok-soft:#163626; --mid:#F0B44C; --mid-soft:#3A2D12; --ng:#FF7B7B; --ng-soft:#3D1C1F;
  --code-bg:#0B0E15; --code-fg:#E6EAF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#171D29; --ink:#E7EBF3; --muted:#9AA5B8; --line:#2A3345;
  --accent:#8F9BFF; --accent-ink:#0F131B; --accent-soft:#252C52;
  --ok:#4CC88A; --ok-soft:#163626; --mid:#F0B44C; --mid-soft:#3A2D12; --ng:#FF7B7B; --ng-soft:#3D1C1F;
  --code-bg:#0B0E15; --code-fg:#E6EAF2; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 24px}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);padding:.05em .35em;border-radius:4px;word-break:break-word}
.muted{color:var(--muted)}
.mark{font-weight:700;font-variant-numeric:tabular-nums}
.mark.o{color:var(--ok)} .mark.t{color:var(--mid)} .mark.x{color:var(--ng)}

/* ---- home ---- */
.top{display:flex;flex-direction:column;gap:4px;padding-block:8px 16px}
.exam{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
.top h1{font-size:26px;font-weight:700;letter-spacing:.01em}
.tally{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:700}
.block{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--accent);padding:4px 0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.chapters{display:flex;flex-direction:column;gap:10px;padding-block:6px 12px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chhead{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px}
.chhead label{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0}
.chno{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;padding-top:3px}
.chtitle{font-weight:700;font-size:15px;line-height:1.45}
.chsub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tog{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none;font-size:13px;color:var(--muted)}
.secs{border-top:1px solid var(--line)}
.sec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.sec:first-child{border-top:none}
.secname{min-width:0;font-size:14px;line-height:1.45}
.secname .n{font-family:var(--f-mono);color:var(--muted);margin-right:6px;font-size:12px}
.seccnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.meter{grid-column:2 / 4;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line)}
.meter i{display:block;height:100%}
.meter .o{background:var(--ok)} .meter .t{background:var(--mid)} .meter .x{background:var(--ng)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0;flex:none}
.startbar{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.primary{width:100%;border:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:500}

/* ---- quiz ---- */
.qbar{display:flex;align-items:center;gap:10px;padding-block:4px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.qbar .pos{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.qbar .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.qbar .track i{display:block;height:100%;background:var(--accent)}
.qbar button{background:none;border:none;color:var(--muted);font-size:14px;padding:4px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.where{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tag.multi{border-color:var(--accent);color:var(--accent);font-weight:600}
.tag.hist{border-color:transparent}
.qtext{font-size:16px;font-weight:500;line-height:1.7}
pre.code{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.6;tab-size:4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;line-height:1.55}
.opt .ab{font-family:var(--f-mono);font-weight:600;color:var(--muted);font-size:13px;padding-top:2px}
.opt .ot{min-width:0;word-break:break-word}
.opt .why{grid-column:2;font-size:13px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .ab{color:var(--ok)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.ng .ab{color:var(--ng)}
.opt:disabled{cursor:default;color:var(--ink)}
.verdict{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.verdict.o{color:var(--ok)} .verdict.x{color:var(--ng)}
.exp{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.75}
.exp h3{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500;margin-bottom:4px}
.back{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px;line-height:1.8}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.gbtn{border-radius:10px;padding:12px 8px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--surface)}
.gbtn.o{border-color:var(--ok);color:var(--ok)}
.gbtn.t{border-color:var(--mid);color:var(--mid)}
.gbtn.x{border-color:var(--ng);color:var(--ng)}
.gbtn small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

/* ---- result / data ---- */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.marks{display:flex;gap:14px;font-size:15px}
.misslist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.misslist li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.misslist li .s{font-size:12px;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:120px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:10px}
.note{font-size:13px;color:var(--muted)}
.toast{font-size:13px;color:var(--ok);min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.gbtn{transition:background-color .15s,border-color .15s}}
</style>

<div id="app"></div>

<script>
const SECTIONS={
1:{t:"Javaの概要と簡単なJavaプログラムの作成",s:{1:"Javaの概要",2:"Java環境とJDK",3:"コマンドラインでのコンパイルと実行",4:"パッケージ宣言とインポート"}},
2:{t:"Javaの基本データ型と文字列の操作",s:{1:"リテラル",2:"変数や定数の宣言と初期化",3:"ローカル変数の型推論",4:"配列",5:"コマンドライン引数の利用",6:"文字列の操作"}},
3:{t:"演算子と条件分岐",s:{1:"演算子と優先順位",2:"データの比較",3:"基本データ型の型変換",4:"基本データ型から参照型への型変換",5:"条件分岐",6:"ifによる分岐",7:"switchによる分岐"}},
4:{t:"繰り返しと制御文の組み合わせ",s:{1:"whileによる繰り返し",2:"forによる繰り返し",3:"制御文の組み合わせ",4:"繰り返しの制御"}},
5:{t:"クラスの宣言とインスタンス化",s:{1:"クラスとオブジェクト",2:"クラスの作成",3:"オブジェクトの生成とアクセス",4:"アクセス修飾子の使用",5:"メソッドのオーバーロード",6:"オブジェクトの初期化",7:"static変数とstaticメソッド",8:"オブジェクトの扱い"}},
6:{t:"継承とインタフェース",s:{1:"継承",2:"メソッドのオーバーライド",3:"継承関係におけるコンストラクタの扱い",4:"java.lang.Objectクラスとレコードクラス",5:"抽象クラス",6:"インタフェース",7:"シールクラス",8:"参照型の型変換とポリモーフィズム",9:"コレクションフレームワーク",10:"コレクションの操作"}},
7:{t:"例外処理",s:{1:"例外発生の仕組みと例外処理",2:"try-catchによる例外のキャッチ",3:"try-with-resourcesによるクローズ",4:"throwsによる例外の転送"}},
8:{t:"横断・使い分けカード",s:{1:"似ている機能の使い分け",2:"用語と書き方"}}
};
const QS=[];
const R=String.raw;
function M(sec,q,code,opts,ans,exp){QS.push({sec,type:'mc',q,code,opts,ans,exp});}
function C(sec,q,code,back){QS.push({sec,type:'card',q,code,back});}
// ===== 第1章 =====
M("1-1","Java言語の特徴として正しいものはどれか。","",[
["コンパイルするとJVM用のバイトコードになり、JVMがあればOSを問わず動く","正解。これが「プラットフォーム非依存（Write once, run anywhere）」の仕組み。"],
["ソースコードをCPUが直接実行する","CPUが直接実行できるのは機械語。Javaはバイトコード→JVMという段階を踏む。"],
["C言語のようにポインタ演算でメモリを直接操作できる","Javaにはポインタ演算がない。参照（アドレスのようなもの）はあるが計算はできない。"],
["使い終わったメモリはfree()で明示的に解放する必要がある","Javaではガベージコレクタ（GC）が不要になったオブジェクトを自動で回収する。"]
],0,"Javaは「ソース(.java) → javacでバイトコード(.class) → JVMが実行」という流れ。OSごとの違いはJVMが吸収する。");
M("1-1","ガベージコレクション（GC）の説明として正しいものはどれか。","",[
["どこからも参照されなくなったオブジェクトのメモリを自動で解放する仕組み","正解。"],
["プログラム終了時にだけ実行され、それまではメモリは解放されない","GCは実行中にJVMが必要に応じて動かす。終了時だけではない。"],
["System.gc()を呼ぶと必ずその場でGCが実行される","System.gc()は「お願い」でしかない。実行は保証されない。"],
["ファイルやDB接続も自動で閉じてくれる","GCが面倒を見るのはメモリだけ。ファイルやDB接続はclose()やtry-with-resourcesで自分で閉じる。"]
],0,"GCの判定基準は「参照されているか（到達可能か）」。詳しくは第5章8節。");
M("1-1","バイトコードの説明として正しいものはどれか。","",[
["javacが生成する.classファイルの中身で、JVMが解釈・実行する中間コード","正解。"],
["OSごとに異なる機械語","OSごとに変わるのはJVMの側。バイトコードはどのOSでも同じ。"],
["人間が読むためのソースコード","それは.javaファイル。"],
["実行時にJVMが.javaファイルから毎回作り直すもの","通常はjavacで事前に作る。ソースファイルモードのときだけメモリ上で作る（1-3参照）。"]
],0,"");
C("1-1","JITコンパイラとは何か？","","JVMが実行中に、よく使われるバイトコードを機械語に変換して高速化する仕組み（Just-In-Time＝実行時に必要になったものをコンパイル）。");
C("1-1","Javaの特徴を3つ言えるか？（試験でよく選択肢になるもの）","","① プラットフォーム非依存（JVMが吸収）\n② オブジェクト指向（クラス・継承・ポリモーフィズム）\n③ メモリ管理はGCが自動で行う（ポインタ演算なし）\nほかに：マルチスレッド対応、豊富な標準API、強い静的型付け。");
M("1-2","JDK・JRE・JVMの関係として正しいものはどれか。","",[
["JDKは開発ツール（javacなど）と実行環境を含み、実行環境の中心がJVMである","正解。JDK ⊃ 実行環境（JRE相当） ⊃ JVM という包含関係。"],
["JVMの中にJDKが含まれる","包含関係が逆。"],
["JREだけあればjavacでコンパイルできる","javacはJDKの開発ツール。JREは実行用なので含まれない。"],
["JDKは実行専用で、コンパイルはできない","JDK＝Java Development Kit（開発キット）。コンパイルもできる。"]
],0,"");
M("1-2","javacコマンドが含まれているものはどれか。","",[
["JDK","正解。Development Kit＝開発用。javac、jar、javadocなどが入っている。"],
["JVM","JVMはバイトコードを実行する仮想マシン。コンパイラではない。"],
["JRE","JREは実行環境。コンパイラは含まれない。"],
["Java API","APIはクラスライブラリ（String、ArrayListなど）。コマンドではない。"]
],0,"");
C("1-2","環境変数PATHにJDKのbinを通すのは何のため？","","javac や java をどのフォルダからでもコマンド名だけで実行できるようにするため。通っていないと「コマンドが見つかりません」になる。");
M("1-3","次のコマンドを実行したとき、生成されるファイルはどれか。",R`javac Hello.java`,[
["Hello.class","正解。ソースファイルの中のクラスごとに「クラス名.class」が生成される。"],
["Hello.exe","Javaは実行ファイル(.exe)を作らない。"],
["Hello.jar","jarはjarコマンドで作るアーカイブ。javacでは作られない。"],
["Hello.byte","そのような拡張子はない。"]
],0,"");
M("1-3","コンパイル済みのHello.classを実行する正しいコマンドはどれか。","",[
["java Hello","正解。javaコマンドには拡張子なしのクラス名を渡す。"],
["java Hello.class","拡張子を付けると「Hello.classというクラス」を探してエラーになる。"],
["javac Hello","javacはコンパイル用。しかも.javaが必要。"],
["run Hello","そのようなコマンドはない。"]
],0,"javacは「ファイル名（.java付き）」、javaは「クラス名（拡張子なし）」。ここは毎回混乱しやすいので、声に出して区別する。");
M("1-3","エントリーポイント（プログラムの開始地点）として正しいmainメソッドを2つ選べ。","",[
["public static void main(String[] args)","正解。基本形。"],
["public void main(String[] args)","staticがない。SE 17ではJVMが呼び出せないので実行時エラーになる（コンパイルは通る）。"],
["public static int main(String[] args)","戻り値はvoidでなければならない。"],
["public static void main(String... x)","正解。可変長引数でもよく、引数名も自由。"],
["static void main(String[] args)","publicがない。JVMから呼べず実行時エラー。"]
],[0,3],"必須なのは public / static / void / String配列（または String...）。`static public` の順でもよく、引数名は何でもよい。`String args[]` の書き方も可。");
M("1-3","次のSample.javaをコンパイルしたとき、生成されるクラスファイルはどれか。",R`// Sample.java
class A {
    public static void main(String[] args) {
        System.out.println("A");
    }
}
class B { }`,[
["A.class と B.class","正解。クラスファイルはクラスごとに作られ、名前はファイル名ではなくクラス名。"],
["Sample.class だけ","Sampleというクラスは定義されていない。"],
["Sample.class と A.class と B.class","ファイル名のクラスファイルは作られない。"],
["コンパイルエラーになる","publicクラスがなければファイル名とクラス名が違っても問題ない。"]
],0,"ルール：publicなトップレベルクラスは1ファイルに1つまでで、ファイル名と同じ名前にする。publicでなければ制約はない。");
M("1-3","Main.javaに次のコードを書いた。コンパイル結果はどうなるか。",R`public class Main { }
public class Sub { }`,[
["コンパイルエラー（publicクラスSubはSub.javaに書く必要がある）","正解。publicなトップレベルクラスは1ファイル1つで、ファイル名と一致が必要。"],
["Main.classとSub.classが生成される","Subがpublicなのでエラーになる。Subのpublicを外せばこうなる。"],
["Main.classだけ生成される","一部だけ生成されることはない。"],
["実行時エラーになる","コンパイルの段階で止まる。"]
],0,"");
M("1-3","ソースファイルモード（`java Hello.java`）の説明として正しいものはどれか。","",[
["メモリ上でコンパイルして実行し、.classファイルは作られない","正解。Java 11から使える。単一ファイルのプログラムを手軽に動かす仕組み。"],
["Hello.classが作られ、次回からはそれが使われる","クラスファイルはディスクに保存されない。"],
["事前にjavacでコンパイルしておく必要がある","不要。javaコマンドが内部でコンパイルする。"],

// ===== 横断：使い分け =====
C("8-1","オーバーロードとオーバーライドの違いは？","","オーバーロード（多重定義）：同じクラス内で、同じ名前・違う引数のメソッドを複数作る。戻り値だけの違いは不可。どれを呼ぶかはコンパイル時に引数の型で決まる。\nオーバーライド（上書き）：親のメソッドを子で同じシグネチャで書き直す。どれが動くかは実行時に実体の型で決まる。@Overrideでチェック。");
C("8-1","抽象クラスとインタフェースの使い分けは？","","抽象クラス：「〜の一種」。共通のフィールドや処理・コンストラクタを持てる。継承は1つだけ（extends）。\nインタフェース：「〜ができる」。持てるのは定数と抽象/default/static/privateメソッド。複数実装できる（implements）。\n迷ったら：状態（フィールド）を共有したい→抽象クラス、能力の約束だけ→インタフェース。");
C("8-1","== と equals の使い分けは？","","== ：基本データ型は値を比較。参照型は「同じオブジェクトか」を比較。\nequals：中身が同じかを比較（String、ラッパー、record、コレクションはオーバーライド済み）。\nStringBuilderと配列はequalsをオーバーライドしていない（== と同じ）。配列の中身はArrays.equals。");
C("8-1","String と StringBuilder の使い分けは？","","String：不変。メソッドは新しい文字列を返す（代入しないと変わらない）。リテラルはプールで共有。\nStringBuilder：可変。append/insert/delete/reverse/replaceで自分自身を書き換える。ループで何度も連結するときに使う。equalsは中身を比べないのでtoString()してから比べる。");
C("8-1","length / length() / size() の使い分けは？","","配列 → arr.length（フィールド、()なし）\nString / StringBuilder → s.length()（メソッド）\nList / Set / Map → list.size()");
C("8-1","switch文とswitch式の使い分けは？","","値を変数に入れたい → switch式（int r = switch(x) { case 1 -> 10; default -> 0; };）\n処理を振り分けたい → switch文\nswitch式は網羅必須（ふつうdefaultが必要）、値は -> か yield、最後に ; 。\n: 形式はbreakを忘れるとフォールスルー、-> 形式はフォールスルーしない。");
C("8-1","classとrecordの使い分けは？","","record：値を入れて運ぶだけの不変データ（座標、検索条件、DTO）。コンストラクタ・アクセサ・equals/hashCode/toStringが自動。継承不可。\nclass：状態を変えたい、継承したい、処理が中心のもの。");
C("8-1","List / Set / Map の使い分けは？","","List（ArrayList）：順番どおりに並べたい、重複OK、添字で取り出す\nSet（HashSet）：重複を除きたい、「含まれているか」を調べたい\nMap（HashMap）：キーで値を引きたい（社員番号→社員など）");
C("8-1","配列とArrayListの使い分けは？","","配列：長さ固定、基本データ型をそのまま入れられる、arr.length、arr[i]\nArrayList：長さが自動で変わる、ラッパー型（List<Integer>）、list.size()、list.get(i)、add/remove");
C("8-1","whileとdo-whileの使い分けは？","","while：条件を先に判定。最初からfalseなら0回。\ndo-while：処理を先に1回実行してから判定。最低1回は実行する（入力を1回は受け付けたいときなど）。最後に ; が必要。");
C("8-1","forと拡張forの使い分けは？","","for：添字が必要、途中から回したい、要素を書き換えたい（arr[i] = …）\n拡張for：全要素を順に読むだけ。変数は要素のコピーなので、変えても元の配列は変わらない。ループ中にListの要素数を変えるとConcurrentModificationException。");
C("8-1","static とインスタンスの使い分けは？","","static：クラスに1つだけ。全インスタンスで共有（カウンタ、定数、便利メソッド）。クラス名.名前で使う。thisは使えない。\nインスタンス：newしたオブジェクトごとに別々の値（名前、年齢）。\nstatic → インスタンスのメンバは直接使えない。");
C("8-1","this と super、this() と super() の違いは？","","this.x：自分のフィールド ／ super.m()：親のメソッド\nthis(…)：同じクラスの別のコンストラクタを呼ぶ\nsuper(…)：親のコンストラクタを呼ぶ\nthis()とsuper()はどちらも1行目だけなので、同時には書けない。書かなければsuper()が自動で入る。");
C("8-1","finalを変数・メソッド・クラスに付けたときの意味は？","","変数：再代入できない（定数）。参照型なら指し先が変えられないだけで、中身は変えられる。\nメソッド：オーバーライドできない。\nクラス：継承できない（String、recordなど）。");
C("8-1","Integer.parseInt と Integer.valueOf の違いは？","","parseInt(\"10\") → int（基本データ型）を返す\nvalueOf(\"10\") → Integer（ラッパー）を返す\nどちらも数字でない文字列だと NumberFormatException。逆に数値→文字列は String.valueOf(10) か 10 + \"\"。");
C("8-1","trim と strip、isEmpty と isBlank の違いは？","","trim：半角スペース・タブなど（\\u0020以下）だけ消す\nstrip：全角スペースも含めたUnicodeの空白を消す\nisEmpty：長さ0のときだけtrue\nisBlank：空白だけ（長さ0も含む）ならtrue");
C("8-1","throw と throws の違いは？","","throw：例外を実際に発生させる文。throw new IOException(\"…\");\nthrows：メソッドが投げる可能性のあるチェック例外を宣言する。void read() throws IOException { }");
C("8-1","try-catch と try-with-resources の使い分けは？","","try-catch：例外を捕まえて処理する。後片付けはfinallyに書く。\ntry-with-resources：ファイル・DB接続などAutoCloseableなものを使うとき。tryが終わると自動でclose()（宣言の逆順）。closeはcatch・finallyより先。");
C("8-1","default / static / private（インタフェースのメソッド）の使い分けは？","","default：実装クラスにそのまま使わせたい共通処理。既存のインタフェースに後からメソッドを追加するとき。オーバーライド可。\nstatic：インスタンスに関係ない便利処理。インタフェース名.m()で呼ぶ（継承されない）。\nprivate：default同士の共通部品。外から見えない。");
C("8-1","フィールドとローカル変数の違いは？","","フィールド：クラス直下に書く。デフォルト値あり（0、false、null）。アクセス修飾子やstaticを付けられる。\nローカル変数：メソッドの中に書く。デフォルト値なし（使う前に必ず代入）。付けられる修飾子はfinalだけ。varが使える。");
C("8-1","値のコピーと参照のコピーの違いは？","","基本データ型：変数に値そのものが入る。代入・引数渡しで値がコピーされ、元には影響しない。\n参照型：変数にはオブジェクトの場所（参照）が入る。代入・引数渡しで参照がコピーされ、同じオブジェクトを指す。中身を変えると元から見ても変わる。ただし変数に別のオブジェクトを入れ直しても元の変数は変わらない。");
C("8-1","暗黙の型変換とキャストの違いは？","","暗黙（自動）：小さい型→大きい型。byte→short→int→long→float→double、char→int。\nキャスト（明示）：大きい型→小さい型。(int) 3.9 → 3（切り捨て）、(byte) 200 → -56（値が化ける）。\n参照型：子→親は自動（アップキャスト）、親→子はキャスト（ダウンキャスト、実体が違えばClassCastException）。");
C("8-2","javac / java / ソースファイルモードの違いは？","","javac Hello.java：コンパイルしてHello.classを作る（ファイル名を渡す）\njava Hello：Hello.classを実行（クラス名を渡す、拡張子なし）\njava Hello.java：メモリ上でコンパイルして即実行（.classは作らない、1ファイルだけ）");
C("8-2","本番の解き方（試験テクニック）","","① まず「コンパイルは通るか」を見る。選択肢に「コンパイルエラー」があれば、出力を追う前に構文を確認\n② 「2つ選べ」などの数を最初に確認\n③ 分からない問題はフラグを立てて飛ばす（60問90分＝1問1分半）\n④ 見直し時間を最低10分残す");
C("8-2","コンパイルエラーになりやすいポイントを10個言えるか？","","① ローカル変数の未初期化 ② varの初期値なし・null ③ {}初期化子を後から代入 ④ final変数への再代入 ⑤ intの計算結果をbyte/shortに代入 ⑥ 到達不能コード（break/return後、while(false)）⑦ switch式でdefaultなし ⑧ staticからインスタンスメンバ ⑨ オーバーライドでアクセスを狭める・チェック例外を増やす ⑩ catchの順番（親が先）・multi-catchで継承関係");
C("8-2","実行時例外になりやすいポイントは？","","ArrayIndexOutOfBounds（添字範囲外、引数なしでargs[0]）／StringIndexOutOfBounds（charAt・substring）／NullPointerException（nullのメソッド呼び出し、nullのアンボクシング、switch(null)）／ClassCastException（ダウンキャスト失敗）／ArithmeticException（整数の0除算）／NumberFormatException（parseInt(\"12a\")）／UnsupportedOperationException（List.ofやasListへのadd）／ConcurrentModificationException（拡張for中の削除）");
C("8-2","Java SE 17で追加された主な書き方は？（SE 11との差分）","","record（レコードクラス）／sealed・permits・non-sealed（シールクラス）／switch式（->、yield）／テキストブロック（\"\"\"）／instanceofのパターンマッチング（o instanceof String s）\n※ラムダ式・関数型インタフェース・モジュールはSE 17 Silverの範囲外。");
M("3-5","次のうち「分岐」の制御構造はどれか。","",[
["if文とswitch文","正解。条件によって実行する処理を選ぶ。"],
["for文とwhile文","これは繰り返し。"],
["breakとcontinue","繰り返しの制御（流れを変える文）。"],
["メソッド呼び出し","順次の一部として扱う。"]
],0,"");
M("3-5","条件式に書けるものはどれか。",R`int x = 1;
boolean f = true;`,[
["if (f) と if (x == 1)","正解。ifやwhileの条件はboolean型の式でなければならない。"],
["if (x)","intはbooleanではない。C言語のように0/1では判定できない。"],
["if (\"true\")","Stringはbooleanではない。"],
["if (x = 1)","代入式の結果はintなのでエラー。"]
],0,"");
M("5-1","次のコードで作られるPersonオブジェクトはいくつか。",R`Person a = new Person();
Person b = new Person();
Person c = a;
Person d = null;`,[
["2個","正解。オブジェクトはnewした回数だけ作られる。c = a は参照のコピー、d = null は何も指さない。"],
["3個","c = a で新しいオブジェクトはできない。"],
["4個","変数の数とオブジェクトの数は別。"],
["1個","newを2回している。"]
],0,"");
M("5-1","オブジェクト指向の説明として正しいものはどれか。","",[
["データ（フィールド）と処理（メソッド）を1つのクラスにまとめて扱う考え方","正解。カプセル化・継承・ポリモーフィズムが3つの柱。"],
["処理を上から順に書くことだけを重視する考え方","それは手続き型の考え方。"],
["mainメソッドを複数作ること","関係ない。"],
["すべてのメソッドをstaticにすること","staticばかりだとオブジェクト指向の利点が使えない。"]
],0,"");
M("1-2","JVMの役割として正しいものはどれか。","",[
["バイトコードを読み込み、そのOS・CPUで実行する","正解。OSごとのJVMが違いを吸収する。"],
["ソースコードをバイトコードに変換する","それはjavac（コンパイラ）の役割。"],
["ソースコードを書くエディタ","JVMは実行環境。"],
["Javaのプログラムを.exeに変換する","変換しない。"]
],0,"");

</script>
<script type="text/plain" id="__appsrc">
(function(){
const LS='jsilver17_v1';
const $app=document.getElementById('app');
let prog={};
try{prog=JSON.parse(localStorage.getItem(LS)||'{}')||{};}catch(e){prog={};}
let ui={sel:null,mode:'normal',len:20,open:{}};
try{const u=JSON.parse(localStorage.getItem(LS+'_ui')||'null');if(u)ui=Object.assign(ui,u);}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(prog));}catch(e){}}
function saveUi(){try{localStorage.setItem(LS+'_ui',JSON.stringify(ui));}catch(e){}}

function h(s){let x=5381;for(let i=0;i<s.length;i++){x=((x<<5)+x+s.charCodeAt(i))|0;}return (x>>>0).toString(36);}
const seen={};
QS.forEach(q=>{let id=h(q.sec+'|'+q.q+'|'+(q.code||''));while(seen[id])id+='_';seen[id]=1;q.id=id;});
const ALLSECS=[];Object.keys(SECTIONS).forEach(c=>Object.keys(SECTIONS[c].s).forEach(s=>ALLSECS.push(c+'-'+s)));
if(!Array.isArray(ui.sel))ui.sel=ALLSECS.slice();
let sel=new Set(ui.sel.filter(k=>ALLSECS.includes(k)));

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>');}
function codeBlock(c){if(!c)return '';const t=c.replace(/^\n+/,'').replace(/\s+$/,'');return '<pre class="code">'+esc(t)+'</pre>';}
function secLabel(k){const [c,s]=k.split('-');return '第'+c+'章 '+s+'. '+SECTIONS[c].s[s];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function stat(list){let o=0,t=0,x=0;list.forEach(q=>{const p=prog[q.id];if(!p)return;if(p.l==='o')o++;else if(p.l==='t')t++;else if(p.l==='x')x++;});return {n:list.length,o,t,x};}
function bySec(k){return QS.filter(q=>q.sec===k);}
function pool(){
  let list=QS.filter(q=>sel.has(q.sec));
  if(ui.mode==='weak')list=list.filter(q=>prog[q.id]&&(prog[q.id].l==='x'||prog[q.id].l==='t'));
  if(ui.mode==='new')list=list.filter(q=>!prog[q.id]);
  return list;
}
function wt(q){const p=prog[q.id];if(!p)return 3;if(p.l==='x')return 6;if(p.l==='t')return 4.5;return Math.max(.5,2.4-p.st*.6);}
function pick(list,n){const a=list.slice(),out=[];while(out.length<n&&a.length){let tot=0;a.forEach(q=>tot+=wt(q));let r=Math.random()*tot,i=0;for(;i<a.length;i++){r-=wt(a[i]);if(r<=0)break;}if(i>=a.length)i=a.length-1;out.push(a.splice(i,1)[0]);}return out;}
function record(id,r){const p=prog[id]||{n:0,o:0,x:0,st:0};p.n++;if(r==='o'){p.o++;p.st++;}else{p.st=0;if(r==='x')p.x++;}p.l=r;prog[id]=p;save();}

/* ================= HOME ================= */
function home(){
  const all=stat(QS);
  const pl=pool();
  const lens=[10,20,30,0];
  let html='<header class="top"><span class="exam">1Z0-825-JPN ／ 紫本の章立て</span><h1>Java Silver 17 ドリル</h1>'+
  '<div class="tally"><span>全<b>'+all.n+'</b>問</span><span class="mark o">○ '+all.o+'</span><span class="mark t">△ '+all.t+'</span><span class="mark x">× '+all.x+'</span><span>未出題 <b>'+(all.n-all.o-all.t-all.x)+'</b></span></div></header>';
  html+='<div class="block"><span class="label">出題モード</span><div class="chips">'+
   [['normal','おまかせ（×△を多めに）'],['weak','×と△だけ'],['new','未出題だけ']].map(m=>'<button class="chip" data-mode="'+m[0]+'" aria-pressed="'+(ui.mode===m[0])+'">'+m[1]+'</button>').join('')+'</div></div>';
  html+='<div class="block"><span class="label">1回の問題数</span><div class="chips">'+
   lens.map(n=>'<button class="chip" data-len="'+n+'" aria-pressed="'+(ui.len===n)+'">'+(n?n+'問':'全部')+'</button>').join('')+'</div></div>';
  html+='<div class="block"><span class="label">範囲（章・節を選ぶ）</span><div class="rowbtns"><button class="linkbtn" id="selAll">すべて選択</button><button class="linkbtn" id="selNone">すべて解除</button></div></div>';
  html+='<div class="chapters">';
  Object.keys(SECTIONS).forEach(c=>{
    const ch=SECTIONS[c];const keys=Object.keys(ch.s).map(s=>c+'-'+s);
    const st=stat(QS.filter(q=>q.sec.split('-')[0]===c));
    const open=!!ui.open[c];
    html+='<div class="ch"><div class="chhead"><label><input type="checkbox" id="ch'+c+'" data-ch="'+c+'"><span><span class="chno">'+(c==='8'?'横断':'第'+c+'章')+'</span><br><span class="chtitle">'+esc(ch.t)+'</span><br><span class="chsub">'+st.n+'問　<span class="mark o">○'+st.o+'</span> <span class="mark t">△'+st.t+'</span> <span class="mark x">×'+st.x+'</span></span></span></label>'+
    '<button class="tog" data-open="'+c+'" aria-expanded="'+open+'" aria-label="節を'+(open?'閉じる':'開く')+'">'+(open?'▲':'▼')+'</button></div>';
    if(open){
      html+='<div class="secs">';
      keys.forEach(k=>{const s=k.split('-')[1];const ss=stat(bySec(k));const w=v=>ss.n?(v/ss.n*100).toFixed(1):0;
        html+='<label class="sec"><input type="checkbox" id="s'+k+'" data-sec="'+k+'" '+(sel.has(k)?'checked':'')+'><span class="secname"><span class="n">'+s+'.</span>'+esc(ch.s[s])+'</span><span class="seccnt">'+ss.n+'問</span>'+
        '<span class="meter" aria-hidden="true"><i class="o" style="width:'+w(ss.o)+'%"></i><i class="t" style="width:'+w(ss.t)+'%"></i><i class="x" style="width:'+w(ss.x)+'%"></i></span></label>';});
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  const n=ui.len?Math.min(ui.len,pl.length):pl.length;
  html+='<div class="startbar"><button class="primary" id="start" '+(pl.length?'':'disabled')+'>'+(pl.length?'開始（'+n+'問 ／ 対象 '+pl.length+'問）':(ui.mode==='weak'?'選んだ範囲に×・△がありません':ui.mode==='new'?'選んだ範囲は全部出題済みです':'範囲を選んでください'))+'</button></div>';
  html+='<div class="rowbtns"><button class="linkbtn" id="toData">記録の書き出し・読み込み・リセット</button></div>';
  $app.innerHTML=html;
  Object.keys(SECTIONS).forEach(c=>{const keys=Object.keys(SECTIONS[c].s).map(s=>c+'-'+s);const on=keys.filter(k=>sel.has(k)).length;const cb=document.getElementById('ch'+c);cb.checked=on===keys.length;cb.indeterminate=on>0&&on<keys.length;});
  $app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ui.mode=b.dataset.mode;saveUi();home();});
  $app.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{ui.len=+b.dataset.len;saveUi();home();});
  $app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const c=b.dataset.open;ui.open[c]=!ui.open[c];saveUi();home();});
  $app.querySelectorAll('[data-ch]').forEach(cb=>cb.onchange=()=>{const c=cb.dataset.ch;Object.keys(SECTIONS[c].s).forEach(s=>{const k=c+'-'+s;cb.checked?sel.add(k):sel.delete(k);});commitSel();});
  $app.querySelectorAll('[data-sec]').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.sec;cb.checked?sel.add(k):sel.delete(k);commitSel();});
  document.getElementById('selAll').onclick=()=>{sel=new Set(ALLSECS);commitSel();};
  document.getElementById('selNone').onclick=()=>{sel=new Set();commitSel();};
  document.getElementById('start').onclick=()=>{const p=pool();start(pick(p,ui.len?Math.min(ui.len,p.length):p.length));};
  document.getElementById('toData').onclick=dataView;
}
function commitSel(){ui.sel=[...sel];saveUi();const y=window.scrollY;home();window.scrollTo(0,y);}

/* ================= QUIZ ================= */
let run=null;
function start(list){if(!list.length)return;run={list,i:0,res:[]};window.scrollTo(0,0);showQ();}
function histTag(q){const p=prog[q.id];if(!p)return '<span class="tag hist">初出題</span>';const m={o:'○',t:'△',x:'×'}[p.l];return '<span class="tag hist">前回 <span class="mark '+p.l+'">'+m+'</span>（'+p.n+'回目）</span>';}
function head(){const N=run.list.length,i=run.i;return '<div class="qbar"><span class="pos">'+(i+1)+' / '+N+'</span><span class="track"><i style="width:'+(i/N*100)+'%"></i></span><button id="quit">終了</button></div>';}
function bindQuit(){document.getElementById('quit').onclick=()=>{if(run.res.length)result();else home();};}
function showQ(){
  const q=run.list[run.i];
  if(q.type==='card')return showCard(q);
  const correct=Array.isArray(q.ans)?q.ans:[q.ans];
  const multi=correct.length>1;
  const order=shuffle(q.opts.map((_,i)=>i));
  const picked=new Set();let done=false;
  const L='ABCDEFG';
  function draw(){
    let html=head()+'<article class="card"><div class="where"><span>'+esc(secLabel(q.sec))+'</span>'+(multi?'<span class="tag multi">'+correct.length+'つ選ぶ</span>':'')+histTag(q)+'</div>';
    html+='<div class="qtext">'+fmt(q.q)+'</div>'+codeBlock(q.code);
    html+='<div class="opts">'+order.map((oi,pos)=>{const o=q.opts[oi];let cls='opt';
      if(done){if(correct.includes(oi))cls+=' ok';else if(picked.has(oi))cls+=' ng';}else if(picked.has(oi))cls+=' picked';
      return '<button class="'+cls+'" data-oi="'+oi+'" '+(done?'disabled':'')+'><span class="ab">'+(done?(correct.includes(oi)?'正':picked.has(oi)?'誤':L[pos]):L[pos])+'</span><span class="ot">'+fmt(o[0])+'</span>'+(done&&o[1]?'<span class="why">'+fmt(o[1])+'</span>':'')+'</button>';}).join('')+'</div>';
    if(!done&&multi)html+='<button class="primary" id="submit" '+(picked.size===correct.length?'':'disabled')+'>回答する（'+picked.size+' / '+correct.length+'）</button>';
    if(done){
      const ok=correct.length===picked.size&&correct.every(c=>picked.has(c));
      html+='<div class="verdict '+(ok?'o':'x')+'">'+(ok?'○ 正解':'× 不正解')+'</div>';
      if(q.exp)html+='<div class="exp"><h3>解説</h3>'+fmt(q.exp)+'</div>';
      html+=ok?'<div class="grade"><button class="gbtn o" data-g="o">○ 次へ<small>理由まで説明できる</small></button><button class="gbtn t" data-g="t">△ 次へ<small>当たったが理由があやふや</small></button></div>'
             :'<div class="grade"><button class="gbtn x" data-g="x">× 次へ<small>あとで復習に回す</small></button></div>';
    }
    html+='</article>';
    $app.innerHTML=html;bindQuit();
    if(!done){
      $app.querySelectorAll('[data-oi]').forEach(b=>b.onclick=()=>{const oi=+b.dataset.oi;
        if(multi){if(picked.has(oi))picked.delete(oi);else if(picked.size<correct.length)picked.add(oi);draw();}
        else{picked.add(oi);done=true;draw();}});
      const sb=document.getElementById('submit');if(sb)sb.onclick=()=>{done=true;draw();};
    }else{
      $app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>next(q,b.dataset.g));
    }
  }
  draw();
}
function showCard(q){
  let shown=false;
  function draw(){
    let html=head()+'<article class="card"><div class="where"><span>'+esc(secLabel(q.sec))+'</span><span class="tag">カード</span>'+histTag(q)+'</div>';
    html+='<div class="qtext">'+fmt(q.q)+'</div>'+codeBlock(q.code);
    if(!shown)html+='<button class="primary" id="reveal">答えを見る</button>';
    else html+='<div class="back">'+fmt(q.back)+'</div><div class="grade"><button class="gbtn o" data-g="o">○ 言えた</button><button class="gbtn t" data-g="t">△ あやふや</button><button class="gbtn x" data-g="x">× 言えなかった</button></div>';
    html+='</article>';
    $app.innerHTML=html;bindQuit();
    if(!shown)document.getElementById('reveal').onclick=()=>{shown=true;draw();};
    else $app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>next(q,b.dataset.g));
  }
  draw();
}
function next(q,g){record(q.id,g);run.res.push({q,g});run.i++;window.scrollTo(0,0);if(run.i>=run.list.length)result();else showQ();}

/* ================= RESULT ================= */
function result(){
  const r=run.res;const o=r.filter(x=>x.g==='o').length,t=r.filter(x=>x.g==='t').length,x=r.filter(x=>x.g==='x').length;
  const pct=r.length?Math.round(o/r.length*100):0;
  const miss=r.filter(v=>v.g!=='o');
  let html='<header class="top"><span class="exam">結果</span><div class="score"><span class="big">'+pct+'%</span><span class="muted">○の割合（合格ライン 65%・目標 80%）</span></div>'+
   '<div class="marks"><span class="mark o">○ '+o+'</span><span class="mark t">△ '+t+'</span><span class="mark x">× '+x+'</span></div></header>';
  if(miss.length){
    html+='<div class="block"><span class="label">×と△（△は実質×として扱う）</span><ul class="misslist">'+miss.map(v=>'<li><span class="mark '+v.g+'">'+({t:'△',x:'×'}[v.g])+'</span><span><span class="s">'+esc(secLabel(v.q.sec))+'</span><br>'+fmt(v.q.q)+'</span></li>').join('')+'</ul></div>';
    html+='<div class="block"><button class="primary" id="again">×と△をもう一度（'+miss.length+'問）</button></div>';
  }else html+='<p class="muted">全問○でした。</p>';
  html+='<div class="block"><button class="secondary" id="home">範囲選択に戻る</button></div>';
  $app.innerHTML=html;window.scrollTo(0,0);
  const a=document.getElementById('again');if(a)a.onclick=()=>start(shuffle(miss.map(v=>v.q)));
  document.getElementById('home').onclick=home;
}

/* ================= DATA ================= */
function dataView(){
  let armed=false;
  const exp=JSON.stringify({app:'jsilver17',v:1,prog});
  $app.innerHTML='<header class="top"><span class="exam">記録</span><h1>書き出し・読み込み</h1></header>'+
  '<div class="block"><span class="label">書き出し</span><p class="note">記録はこのブラウザにだけ保存されます。別の端末に移すときは、下の文字列をコピーして移した先の「読み込み」に貼り付けてください。</p><textarea id="expTa" readonly>'+esc(exp)+'</textarea><div class="rowbtns"><button class="secondary" id="copy">コピー</button></div><div class="toast" id="t1"></div></div>'+
  '<div class="block"><span class="label">読み込み</span><textarea id="impTa" placeholder="書き出した文字列を貼り付け"></textarea><div class="rowbtns"><button class="secondary" id="imp">読み込む</button></div><div class="toast" id="t2"></div></div>'+
  '<div class="block"><span class="label">リセット</span><p class="note">○△×の記録をすべて消します。元に戻せません。</p><div class="rowbtns"><button class="secondary" id="reset">記録をすべて消す</button></div><div class="toast" id="t3"></div></div>'+
  '<div class="block"><button class="secondary" id="home">範囲選択に戻る</button></div>';
  document.getElementById('copy').onclick=()=>{const ta=document.getElementById('expTa');const done=()=>document.getElementById('t1').textContent='コピーしました';
    try{navigator.clipboard.writeText(exp).then(done,()=>{ta.select();document.getElementById('t1').textContent='選択しました。長押しでコピーしてください';});}catch(e){ta.select();}};
  document.getElementById('imp').onclick=()=>{const t2=document.getElementById('t2');try{const d=JSON.parse(document.getElementById('impTa').value);if(!d||d.app!=='jsilver17'||typeof d.prog!=='object')throw 0;prog=d.prog;save();t2.style.color='';t2.textContent='読み込みました（'+Object.keys(prog).length+'問分の記録）';}catch(e){t2.style.color='var(--ng)';t2.textContent='読み込めませんでした。書き出した文字列をそのまま貼り付けてください。';}};
  document.getElementById('reset').onclick=e=>{const b=e.currentTarget;if(!armed){armed=true;b.textContent='本当に消す（もう一度押す）';b.style.borderColor='var(--ng)';b.style.color='var(--ng)';return;}prog={};save();b.textContent='記録をすべて消す';b.style.cssText='';armed=false;document.getElementById('t3').textContent='消去しました';};
  document.getElementById('home').onclick=home;
  window.scrollTo(0,0);
}
home();
})();
</script>
<script>
/* ============================================================
   サーバー保存ブート（倉庫サーバー用に追加）
   アプリ本体のコードは一切変更していない。
   localStorage の読み書きだけを KVストア（/api/kv/）に差し替え、
   iPhone と Mac で同じ進捗を共有する。

   データを守る仕組み:
     1. 起動時にサーバーから読めなかったら、以降の保存を止める
     2. 他の端末が先に更新していたら（409）、保存を止めて再読み込みを促す
     3. 画面に戻ったとき、他の端末での更新がないか確認する
   ============================================================ */
(function () {
  var API = '/api/kv/';
  var KEY_MAIN = 'jsilver17_v1';
  var KEY_UI = KEY_MAIN + '_ui';
  var KEYS = [KEY_MAIN, KEY_UI];

  var cache = {};     // キー → 値（文字列）
  var rev = {};       // キー → リビジョン番号（0 は未保存）
  var timer = {};     // キー → 書き込みをまとめるタイマー
  var blocked = null; // 保存を止めた理由（null なら正常）

  /* ---- 画面下部のお知らせ ---- */
  var box = null;
  function notice(title, message, info) {
    if (box) box.remove();
    info = info || {};
    box = document.createElement('div');
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2147483647;background:#FFF1F1;border:2px solid #E5484D;border-radius:12px;padding:12px 14px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#1F2328;box-shadow:0 6px 24px rgba(0,0,0,.18)';
    var t = document.createElement('div');
    t.style.cssText = 'font-weight:700;color:#B42318;margin-bottom:4px';
    t.textContent = title;
    var m = document.createElement('div');
    m.textContent = message;
    box.appendChild(t);
    box.appendChild(m);
    var meta = [];
    if (info.code) meta.push('エラーコード: ' + info.code);
    if (info.where) meta.push('発生箇所: ' + info.where);
    if (info.errorId && info.errorId !== '-') meta.push('エラーID: ' + info.errorId);
    if (meta.length) {
      var s = document.createElement('div');
      s.style.cssText = 'font-size:12px;color:#57606A;margin-top:6px;word-break:break-all';
      s.textContent = meta.join(' ／ ');
      box.appendChild(s);
    }
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;margin-top:10px;justify-content:flex-end';
    row.appendChild(button('閉じる', false, function () { box.remove(); box = null; }));
    row.appendChild(button('再読み込み', true, function () { location.reload(); }));
    box.appendChild(row);
    document.body.appendChild(box);
  }
  function button(label, primary, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.style.cssText = 'padding:8px 14px;border-radius:8px;font:600 14px -apple-system,sans-serif;cursor:pointer;' +
      (primary ? 'border:none;background:#E5484D;color:#fff' : 'border:1px solid #D0D7DE;background:#fff;color:#1F2328');
    b.addEventListener('click', fn);
    return b;
  }

  function url(k) { return API + encodeURIComponent(k); }

  /* ---- 読み込み ---- */
  function load(k) {
    return fetch(url(k), { cache: 'no-store' }).then(function (r) {
      if (r.status === 404) { cache[k] = null; rev[k] = 0; return; }   // 未保存は正常
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json().then(function (j) {
        if (!j || j.ok !== true) throw new Error('想定外の応答');
        cache[k] = j.data.value;
        rev[k] = j.data.revision;
      });
    });
  }

  /* ---- 保存 ---- */
  function push(k, keepalive) {
    if (blocked) return Promise.resolve();
    var opt = {
      method: 'PUT',
      headers: { 'Content-Type': 'text/plain; charset=utf-8', 'X-Expected-Revision': String(rev[k] || 0) },
      body: cache[k] == null ? '' : cache[k]
    };
    if (keepalive) opt.keepalive = true;
    return fetch(url(k), opt).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (r.ok && j && j.ok === true) { rev[k] = j.data.revision; return; }
        var e = (j && j.error) || {};
        if (r.status === 409) {
          blocked = e;
          notice('他の端末で更新されています',
            e.message || '他の端末で先に更新されています。再読み込みしてから続けてください', e);
        } else {
          notice('保存できませんでした', e.message || ('サーバーが HTTP ' + r.status + ' を返しました'), e);
        }
      });
    }).catch(function () {
      notice('保存できませんでした',
        'サーバーに接続できません。Tailscale がオンになっているか確認してください', { code: 'KV-CL-02' });
    });
  }

  function schedule(k) {
    clearTimeout(timer[k]);
    timer[k] = setTimeout(function () { push(k, false); }, 400);
  }

  function flush(keepalive) {
    KEYS.forEach(function (k) {
      if (timer[k]) { clearTimeout(timer[k]); timer[k] = 0; push(k, keepalive); }
    });
  }

  /* ---- アプリに渡す localStorage の代わり ---- */
  var shim = {
    getItem: function (k) {
      return Object.prototype.hasOwnProperty.call(cache, k) ? cache[k] : null;
    },
    setItem: function (k, v) {
      v = String(v);
      cache[k] = v;
      if (blocked) {
        notice('保存を停止しています',
          'データを守るため保存を止めています。再読み込みしてから続けてください（原因: ' +
          (blocked.code || '不明') + '）', { code: 'KV-CL-04' });
        return;
      }
      schedule(k);
    },
    removeItem: function (k) { cache[k] = null; if (!blocked) schedule(k); },
    clear: function () { KEYS.forEach(function (k) { cache[k] = null; }); if (!blocked) KEYS.forEach(schedule); },
    key: function (i) { return KEYS[i] || null; },
    get length() { return KEYS.length; }
  };

  /* ---- 画面に戻ったときの更新チェック ---- */
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); flush(true); return; }
    if (blocked || !hiddenAt || Date.now() - hiddenAt < 30000) return;
    Promise.all(KEYS.map(function (k) {
      return fetch(url(k) + '/meta', { cache: 'no-store' }).then(function (r) {
        if (r.status === 404) return 0;
        if (!r.ok) return rev[k];
        return r.json().then(function (j) { return (j && j.ok) ? j.data.revision : rev[k]; });
      });
    })).then(function (list) {
      for (var i = 0; i < KEYS.length; i++) {
        if (list[i] !== (rev[KEYS[i]] || 0)) {
          blocked = { code: 'KV-CL-05' };
          notice('他の端末で更新されています',
            '他の端末で進捗が更新されています。再読み込みして最新の状態から続けてください',
            { code: 'KV-CL-05', where: '画面側（更新チェック）' });
          return;
        }
      }
    }).catch(function () { /* 通信できないときは次の保存時に分かる */ });
  });
  window.addEventListener('pagehide', function () { flush(true); });

  /* ---- 読み込みが終わってからアプリ本体を動かす ---- */
  function run() {
    var src = document.getElementById('__appsrc');
    if (!src) return;
    new Function('localStorage', src.textContent)(shim);
  }

  Promise.all(KEYS.map(load)).then(run).catch(function (e) {
    blocked = { code: 'KV-CL-02' };
    KEYS.forEach(function (k) { if (!(k in cache)) { cache[k] = null; rev[k] = 0; } });
    run();
    notice('進捗を読み込めませんでした',
      'この状態で解いた結果は保存されません。サーバーの状態を確認して再読み込みしてください（' + e.message + '）',
      { code: 'KV-CL-02', where: '画面側（起動時の読み込み）' });
  });
})();
</script>
